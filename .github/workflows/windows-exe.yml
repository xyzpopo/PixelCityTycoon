name: Windows EXE build

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "multiplayer_client.py"
      - "virtual_keyboard.py"
      - "prepare_korean_font.py"
      - "tests/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/windows-exe.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "multiplayer_client.py"
      - "virtual_keyboard.py"
      - "prepare_korean_font.py"
      - "tests/**"
      - "assets/**"
      - "requirements.txt"
      - ".github/workflows/windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install fonttools

      - name: Run game regression tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest discover -s tests -v

      - name: Download Korean font
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets/fonts | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" -OutFile "assets/fonts/NotoSansKR[wght].ttf"
          if ((Get-Item -LiteralPath "assets/fonts/NotoSansKR[wght].ttf").Length -lt 10000) { throw "Korean font download is incomplete." }

      - name: Prepare static Korean font
        run: python prepare_korean_font.py

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PixelCityTycoon --add-data "assets/buildings;assets/buildings" --add-data "assets/fonts;assets/fonts" --hidden-import websocket main.py

      - name: Launch packaged EXE smoke test
        shell: pwsh
        run: |
          $env:SDL_VIDEODRIVER = "dummy"
          $env:SDL_AUDIODRIVER = "dummy"
          $process = Start-Process -FilePath "dist/PixelCityTycoon.exe" -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) { throw "The packaged game exited during startup smoke test (code $($process.ExitCode))." }
          Stop-Process -Id $process.Id -Force

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PixelCityTycoon.exe")) { throw "EXE was not created." }
          if ((Get-Item "dist/PixelCityTycoon.exe").Length -lt 1000000) { throw "EXE is unexpectedly small." }

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PixelCityTycoon-Windows
          path: dist/PixelCityTycoon.exe
          if-no-files-found: error
          retention-days: 14
