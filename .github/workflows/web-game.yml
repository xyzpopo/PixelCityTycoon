name: Build and deploy web game

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "assets/**"
      - "requirements-web.txt"
      - ".github/workflows/web-game.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "assets/**"
      - "requirements-web.txt"
      - ".github/workflows/web-game.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pixel-city-tycoon-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install web build dependencies
        run: python -m pip install --upgrade pip pygame-ce pygbag

      - name: Build browser version
        run: python -m pygbag --build --ume_block 0 --title "Pixel City Tycoon" --package pixel-city-tycoon .

      - name: Verify web output
        run: test -s build/web/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    # Keep deployment opt-in until the repository's Pages plan/settings are confirmed.
    if: github.event_name != 'pull_request' && vars.ENABLE_GITHUB_PAGES == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
